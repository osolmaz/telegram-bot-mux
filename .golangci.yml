version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - cyclop
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - wastedassign
  settings:
    cyclop:
      max-complexity: 15
      package-average: 10
    errorlint:
      errorf: true
    gosec:
      excludes:
        - G104
    revive:
      confidence: 0.8
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - cyclop
          - errcheck
          - gosec
          - noctx
          - unparam

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
