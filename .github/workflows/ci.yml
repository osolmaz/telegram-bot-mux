name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: ./scripts/check-format.sh
      - run: go vet ./...
      - run: go test -race ./...
      - run: ./scripts/check-coverage.sh
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Secret scan
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          gitleaks detect --no-git --redact --exit-code 1
      - name: Build supported Linux targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath ./cmd/telegram-bot-mux
          rm telegram-bot-mux
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath ./cmd/telegram-bot-mux
          rm telegram-bot-mux
      - name: Install Slophammer
        run: go install github.com/osolmaz/slophammer/go/cmd/slophammer-go@v0.4.1
      - name: Slophammer DRY check
        run: slophammer-go dry .
      - name: Slophammer CRAP check
        run: slophammer-go crap .
      - name: Slophammer routing mutation scan
        run: slophammer-go mutate . --target internal/routing/routing.go --scan
      - name: Slophammer store mutation scan
        run: slophammer-go mutate . --target internal/store/store.go --scan
      - name: Slophammer policy check
        run: slophammer-go check .

  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Slophammer
        run: go install github.com/osolmaz/slophammer/go/cmd/slophammer-go@v0.4.1
      - name: Mutate routing
        run: slophammer-go mutate . --target internal/routing/routing.go
      - name: Mutate store
        run: slophammer-go mutate . --target internal/store/store.go
