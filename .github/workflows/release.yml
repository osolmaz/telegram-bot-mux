name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git branch -r --contains "$GITHUB_SHA" | grep -c 'origin/main')" -gt 0
      - run: go test ./...
      - name: Build release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            dir="telegram-bot-mux_${TAG#v}_${os}_${arch}"
            mkdir -p "dist/$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG#v}" \
              -o "dist/$dir/telegram-bot-mux" ./cmd/telegram-bot-mux
            cp LICENSE README.md "dist/$dir/"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
            rm -rf "dist/$dir"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.event.release.tag_name }}
          tags: |
            ghcr.io/osolmaz/telegram-bot-mux:${{ github.event.release.tag_name }}
            ghcr.io/osolmaz/telegram-bot-mux:latest
